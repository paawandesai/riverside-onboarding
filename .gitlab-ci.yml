# CI: secret scan, lint, tests with coverage gates, end-to-end tests, license audit, OCR eval, container build.
# No secrets are needed: tests use random per-run keys and never call the Claude API.

stages: [scan, test, build]

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

secret-scan:
  stage: scan
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0  # scan the full history, not just the last commit
  script:
    - gitleaks git --redact --no-banner --verbose .

backend:
  stage: test
  image: python:3.13-slim-bookworm
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_DB: onboarding_test
    POSTGRES_USER: onboarding
    # Throwaway service container that only exists for this job; no password needed.
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql+pg8000://onboarding@db:5432/onboarding_test
  cache:
    key: { files: [backend/requirements.lock] }
    paths: [.cache/pip]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng && rm -rf /var/lib/apt/lists/*
    # Runtime packages from the hash-pinned lock (what the image ships), then the test tools.
    - cd backend && pip install --require-hashes --no-deps -r requirements.lock && pip install -r requirements-dev.txt
    # Throwaway per-job keys, generated here so none live in the repo or CI settings.
    - export SESSION_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
    - export FIELD_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')"
    - export EMAIL_HMAC_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
  script:
    - ruff check .
    - ruff format --check .
    # Migrations must build the same schema the models describe.
    - alembic upgrade head
    - alembic check
    - pytest --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
    # The frontend's API types are generated from this schema; fail if the committed copy is stale.
    - python -m scripts.export_openapi /tmp/openapi.json
    - 'cmp /tmp/openapi.json ../frontend/src/api/openapi.json || (echo "Stale schema. Run python -m scripts.export_openapi, then npm run gen:api" && exit 1)'
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
      coverage_report: { coverage_format: cobertura, path: backend/coverage.xml }

frontend:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key: { files: [frontend/package-lock.json] }
    paths: [.cache/npm]
  before_script:
    - cd frontend && npm ci --no-audit --no-fund
  script:
    - npm run lint
    - npm run typecheck
    # Generated types must match the committed OpenAPI schema.
    - cp src/api/schema.d.ts /tmp/schema.d.ts && npm run gen:api && cmp src/api/schema.d.ts /tmp/schema.d.ts
    - npm test
    - npm run build

e2e:
  stage: test
  # Browsers and Node come with the image (version matches @playwright/test); Python and Tesseract
  # are added for the real API, which serves the built frontend.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_DB: onboarding_e2e
    POSTGRES_USER: onboarding
    POSTGRES_HOST_AUTH_METHOD: trust
    E2E_DATABASE_URL: postgresql+pg8000://onboarding@db:5432/onboarding_e2e
    OMP_THREAD_LIMIT: "1"
  cache:
    - key: { files: [frontend/package-lock.json] }
      paths: [.cache/npm]
    - key: { files: [backend/requirements.lock] }
      paths: [.cache/pip]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-venv tesseract-ocr tesseract-ocr-eng && rm -rf /var/lib/apt/lists/*
    - python3 -m venv backend/.venv && backend/.venv/bin/pip install --require-hashes --no-deps -r backend/requirements.lock
    - cd frontend && npm ci --no-audit --no-fund && npm run build
  script:
    # Real API, real database, real OCR; only the chat call is broken on purpose in one test.
    - npx playwright test
  artifacts:
    when: on_failure
    paths: [frontend/playwright-report, frontend/test-results]
    expire_in: 7 days

licenses:
  stage: test
  image: python:3.13-slim-bookworm
  cache:
    key: { files: [backend/requirements.lock] }
    paths: [.cache/pip]
  before_script:
    - python -m venv backend/.venv && backend/.venv/bin/pip install --require-hashes --no-deps -r backend/requirements.lock && backend/.venv/bin/pip install -r backend/requirements-dev.txt
  script:
    # Regenerate and fail if a shipped package has a disallowed license or LICENSES.md is stale.
    - backend/.venv/bin/python scripts/license_audit.py --check

terraform:
  stage: test
  image:
    name: hashicorp/terraform:1.16.6
    entrypoint: [""]
  script:
    - cd infra/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

ocr-eval:
  stage: test
  image: python:3.13-slim-bookworm
  cache:
    key: { files: [backend/requirements.lock] }
    paths: [.cache/pip]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng && rm -rf /var/lib/apt/lists/*
    - pip install --require-hashes --no-deps -r backend/requirements.lock
  script:
    # Rule fallback + OCR only; the Claude path is measured manually because it costs API credit.
    - cd backend && python ../eval/run_eval.py
  artifacts:
    when: always
    paths: [eval/results/latest.json]

docker-image:
  stage: build
  # Manual: the project runner is unprivileged and blocks user namespaces, so neither
  # Docker-in-Docker nor Buildah can build here (tried both). The same Dockerfile is built and
  # smoke-tested locally and by infra/deploy.sh. Run this job on a runner that allows it.
  when: manual
  allow_failure: true
  image: docker:27.5.1
  services: ["docker:27.5.1-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$CI_PROJECT_PATH_SLUG:$CI_COMMIT_SHORT_SHA" .
