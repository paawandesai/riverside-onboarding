# CI: secret scan, lint, tests with coverage gates, license audit, OCR eval, container build.
# No secrets are needed: tests use random per-run keys and never call the Claude API.

stages: [scan, test, build]

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

secret-scan:
  stage: scan
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0  # scan the full history, not just the last commit
  script:
    - gitleaks git --redact --no-banner --verbose .

backend:
  stage: test
  image: python:3.13-slim-bookworm
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_DB: onboarding_test
    POSTGRES_USER: onboarding
    # Throwaway service container that only exists for this job; no password needed.
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql+pg8000://onboarding@db:5432/onboarding_test
  cache:
    key: { files: [backend/requirements.lock] }
    paths: [.cache/pip]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng && rm -rf /var/lib/apt/lists/*
    - cd backend && pip install -r requirements-dev.txt
  script:
    - ruff check . && ruff format --check .
    # Migrations must build the same schema the models describe.
    - alembic upgrade head && alembic check
    - pytest --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
      coverage_report: { coverage_format: cobertura, path: backend/coverage.xml }

frontend:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key: { files: [frontend/package-lock.json] }
    paths: [.cache/npm]
  before_script:
    - cd frontend && npm ci --no-audit --no-fund
  script:
    - npm run lint
    - npm run typecheck
    - npm test -- --ci
    - npm run build

licenses:
  stage: test
  image: python:3.13-slim-bookworm
  cache:
    key: { files: [backend/requirements.lock] }
    paths: [.cache/pip]
  before_script:
    - python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
  script:
    # Regenerate and fail if a shipped package has a disallowed license or LICENSES.md is stale.
    - backend/.venv/bin/python scripts/license_audit.py --check

ocr-eval:
  stage: test
  image: python:3.13-slim-bookworm
  cache:
    key: { files: [backend/requirements.lock] }
    paths: [.cache/pip]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng && rm -rf /var/lib/apt/lists/*
    - pip install -r backend/requirements.txt
  script:
    # Rule fallback + OCR only; the Claude path is measured manually because it costs API credit.
    - cd backend && python ../eval/run_eval.py
  artifacts:
    when: always
    paths: [eval/results/latest.json]

image:
  stage: build
  image: docker:27.5.1
  services: ["docker:27.5.1-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$CI_PROJECT_PATH_SLUG:$CI_COMMIT_SHORT_SHA" .
