# Install with: pre-commit install  (needs the gitleaks binary on PATH; see README)
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --redact --no-banner .
        language: system
        pass_filenames: false
      - id: staged-secret-grep
        name: grep staged diff for secret-looking values
        entry: scripts/check-staged-secrets.sh
        language: script
        pass_filenames: false
