# Local stack: Postgres + the app container. Secrets come from your local .env (never committed).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: onboarding
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+pg8000://onboarding:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/onboarding
      CORS_ORIGINS: http://localhost:8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
